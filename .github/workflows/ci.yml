name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-library-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-library-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Run library tests
        run: mix test

      - name: Hex package smoke build
        run: mix hex.build

  website:
    name: Website tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            website/deps
            website/_build
          key: ${{ runner.os }}-mix-website-${{ hashFiles('mix.lock', 'website/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-website-

      - name: Install library Mix dependencies
        run: mix deps.get

      - name: Install website Mix dependencies
        working-directory: website
        run: mix deps.get

      - name: Run website tests
        working-directory: website
        run: mix test
